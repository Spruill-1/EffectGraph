name: Release

# Pushing a tag v<major>.<minor>.<patch> that matches EFFECTGRAPH_VERSION_STRING
# runs CI, packs EffectGraph, EffectGraph.Native and EffectGraph.Engine with the
# v143 toolset, records an SBOM and build provenance, and then waits in the
# 'release' environment for approval before pushing to nuget.org.
#
# One-time setup (docs/development/releasing.md): the 'release' environment
# with a required reviewer, the repository variable NUGET_USER, and a nuget.org
# trusted publishing policy for this repository and workflow. No API key is
# stored: NuGet/login trades the job's OIDC token for a short-lived key.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    name: Pack, SBOM and provenance
    needs: ci
    # VS 2022's image: the windows-2025 image has v143 for x64 only, not ARM64.
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against EffectGraphVersion.h
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $header = (Select-String -Path Engine\Api\EffectGraphVersion.h `
              -Pattern 'EFFECTGRAPH_VERSION_STRING\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$header") {
              Write-Error "Tag $tag does not match EFFECTGRAPH_VERSION_STRING $header; bump Engine/Api/EffectGraphVersion.h or retag."
              exit 1
          }
          "version=$header" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: NuGet restore
        run: nuget restore EffectGraph.slnx -SolutionDirectory .

      # The oldest supported toolset: a static library links only with its own
      # toolset or a newer one.
      - name: Pack
        shell: pwsh
        run: pwsh -File packaging\Pack.ps1 -PlatformToolset v143

      - name: SBOM
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.13
          # The scan skips packaging/: its .nuspec files are our own packages, not
          # dependencies, and packaging/out holds the SBOM being written.
          sbom-tool generate -b packaging/out -bc . -pn EffectGraph -pv ${{ steps.version.outputs.version }} `
            -ps "EffectGraph contributors" -nsb https://github.com/${{ github.repository }} -V Warning `
            -cd "--DirectoryExclusionList **/packaging/**"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packaging/out/_manifest/spdx_2.2/manifest.spdx.json "packaging/out/EffectGraph.${{ steps.version.outputs.version }}.spdx.json"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packaging/out/*.nupkg

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            packaging/out/*.nupkg
            packaging/out/*.spdx.json
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: pack
    runs-on: ubuntu-24.04
    # Required reviewers on this environment are the approval gate.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: EffectGraph ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/*.nupkg
            out/*.spdx.json
